# VND v4 observation/action contract for the ROS test node (policy_v000015).
# Mirrors ~/mujoco_auv_env/config/obs_act.yaml; the termination block is
# merged from task_config.yaml (the ROS node reads spec['termination']).

dt: 0.05            # control period [s]
control_rate: 20    # [Hz]; matches /vuram/pose_gt exactly (no interpolation)

a_dim: 5             # normalized [X,Y,Z,K,N] desired body wrench
a_range: [-1.0, 1.0]
thruster_dim: 6
history_len: 20
latent_dim: 12

# Dynamics state s = [u, v, w, p, q, r, qw, qx, qy, qz, x, y, z]
# body lin velocity | body ang velocity | unit quaternion wxyz | world pos (ENU)
s_dim: 13
body_lin_vel: [0, 3]
body_ang_vel: [3, 6]
att:          [6, 10]
pos:          [10, 13]

# e_att is the shortest relative rotation vector in the current body frame.
# Policy observation = [e_pos(3), e_att(3), v_body(6), v_ref_lin(3), w_ref_z(1), a_prev(5)]
obs_dim: 21
obs_layout:
  e_pos:     {start: 0,  len: 3}    # pos_ref - pos, world ENU
  e_att:     {start: 3,  len: 3}    # log(conj(q_state) * q_ref); ref tilt is zero
  v_body:    {start: 6,  len: 6}    # body-frame lin+ang velocity
  v_ref_lin: {start: 12, len: 3}    # reference linear velocity, world ENU
  w_ref_z:   {start: 15, len: 1}    # reference yaw rate
  a_prev:    {start: 16, len: 5}    # previous normalized action (zeros at episode start)

termination:
  max_pos_err: 3.0    # [m]; hopeless episodes are cut early (bad-trajectory
                      # pruning, cf. the SuperDyno paper)
  surface_z: -1.0     # [m]; z above this means surfaced
  max_tilt: 1.2       # [rad]; angle between vehicle up and world up
  grace_steps: 60     # steps (3 s) before position/surface/tilt checks;
                      # applies after the teleport: spawn errors reach ~4.2 m
